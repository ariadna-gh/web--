<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusBoard</title>

  <!-- Design System -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header" role="banner">
    <div class="logo"><strong>FocusBoard</strong></div>
    <nav class="nav" aria-label="Main navigation">
      <a href="#" class="nav-link">Dashboard</a>
      <a href="#" class="nav-link">Projects</a>
      <a href="#" class="nav-link">Settings</a>
    </nav>
    <div class="header-actions">
      <button class="btn-primary" id="openModal">New Task</button>
      <button class="btn-secondary" id="themeToggle">Toggle Theme</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="layout" role="main">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Sidebar menu">
      <h2 class="sidebar-title">Menu</h2>
      <ul class="sidebar-menu">
        <li><a href="#" class="sidebar-link">Today</a></li>
        <li><a href="#" class="sidebar-link">Upcoming</a></li>
        <li><a href="#" class="sidebar-link">Completed</a></li>
      </ul>
    </aside>

    <!-- Task section -->
    <section class="task-list" aria-labelledby="task-heading">
      <h2 id="task-heading" class="section-title">My Tasks</h2>
      <!-- Task cards будуть додаватися пізніше -->
       
  <article class="task-card">
  <div class="task-header">
    <h3>Design system architecture</h3>
    <span class="badge badge-success">Active</span>
  </div>
  <p>Create tokens, atomic components and layout structure.</p>
  <div class="task-actions">
    <button class="btn-secondary">Complete</button>
    <button class="btn-danger">Delete</button>
  </div>
</article>

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer" role="contentinfo">
    <p>© 2026 FocusBoard</p>
  </footer>

</body>

<script>
  const themeToggle = document.getElementById('themeToggle');
  const htmlEl = document.documentElement;


  // Перевіряємо локальне збереження теми
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    htmlEl.setAttribute('data-theme', savedTheme);
  }


  themeToggle.addEventListener('click', () => {
    const currentTheme = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    htmlEl.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme); // збереження вибору користувача
  });
</script>

</html>
