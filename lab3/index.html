<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusBoard</title>

  <!-- Design System -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="styles.css">
</head>

<!-- MODAL OVERLAY -->
<div class="modal-overlay" hidden></div>

<!-- MODAL -->
<div 
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="taskModalTitle"
  hidden
>
  <h2 id="taskModalTitle">Create Task</h2>

  <input type="text" class="input" placeholder="Task title" />

  <div class="task-actions">
    <button class="btn-secondary" id="cancelTaskModal">Cancel</button>
    <button class="btn-primary">Save</button>
  </div>
</div>

<body>

  <!-- HEADER -->
  <header class="header" role="banner">
    <div class="logo"><strong>FocusBoard</strong></div>
    <nav class="nav" aria-label="Main navigation">
      <a href="#" class="nav-link">Dashboard</a>
      <a href="#" class="nav-link">Projects</a>
      <a href="#" class="nav-link">Settings</a>
    </nav>
    <div class="header-actions">
      <button class="btn-primary" id="openModal">New Task</button>
      <button class="btn-secondary" id="themeToggle">Toggle Theme</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="layout" role="main">
    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Sidebar menu">
      <h2 class="sidebar-title">Menu</h2>
      <ul class="sidebar-menu">
        <li><a href="#" class="sidebar-link">Today</a></li>
        <li><a href="#" class="sidebar-link">Upcoming</a></li>
        <li><a href="#" class="sidebar-link">Completed</a></li>
      </ul>
    </aside>

    <!-- Task section -->
    <section class="task-list" aria-labelledby="task-heading">
      <h2 id="task-heading" class="section-title">My Tasks</h2>
      <!-- Task cards будуть додаватися пізніше -->
       
  <article class="task-card">
  <div class="task-header">
    <h3>Design note</h3>
    <span class="badge badge-success">Active</span>
  </div>
  <p>Improve adaptive design system. Upgrade theme selection.</p>
  <div class="task-actions">
    <button class="btn-secondary">Complete</button>
    <button class="btn-danger">Delete</button>
  </div>
</article>

    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer" role="contentinfo">
    <p>© 2026 FocusBoard</p>
  </footer>

</body>

<script>
  const themeToggle = document.getElementById('themeToggle');
const htmlEl = document.documentElement;

const openBtn = document.getElementById('openModal');
const modal = document.querySelector('.modal');
const overlay = document.querySelector('.modal-overlay');
const closeBtn = document.getElementById('cancelTaskModal');

let lastFocusedElement;

// тема
const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  htmlEl.setAttribute('data-theme', savedTheme);
}

themeToggle.addEventListener('click', () => {
  const currentTheme =
    htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  htmlEl.setAttribute('data-theme', currentTheme);
  localStorage.setItem('theme', currentTheme);
});

// OPEN MODAL
openBtn.addEventListener('click', () => {
  lastFocusedElement = document.activeElement;

  modal.hidden = false;
  overlay.hidden = false;

  document.body.style.overflow = 'hidden';

  const firstInput = modal.querySelector('input, button');
  firstInput.focus();
});

// CLOSE MODAL
function closeModal() {
  modal.hidden = true;
  overlay.hidden = true;

  document.body.style.overflow = '';

  if (lastFocusedElement) {
    lastFocusedElement.focus();
  }
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', closeModal);

// ESC
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modal.hidden) {
    closeModal();
  }
});

// FOCUS TRAP
modal.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;

  const focusable = modal.querySelectorAll(
    'a[href], button, textarea, input, select, [tabindex]:not([tabindex="-1"])'
  );

  const first = focusable[0];
  const last = focusable[focusable.length - 1];

  if (e.shiftKey) {
    if (document.activeElement === first) {
      e.preventDefault();
      last.focus();
    }
  } else {
    if (document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
});
</script>

</html>
